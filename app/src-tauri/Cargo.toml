[package]
name = "chordial-app"
version = "0.1.0"
description = "chordial desktop app — rooms, cycles, and the council"
authors = ["Megan (DainDeer)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the collector's tiny loopback POST to the sidecar - deliberately not a
# full async http stack; it runs on its own thread at a 2s cadence
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
# frontmost application's bundle id via NSWorkspace - the ONLY appkit
# surface the collector touches (never window titles, never content)
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# idle seconds via GetLastInputInfo - a counter read, no hooks, no
# permissions (rewind's windows leg; docs/REWIND_DESIGN.md section 9)
windows-sys = { version = "0.59", features = [
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

